<p-toast></p-toast> <!-- contenedor para las notificaciones de error -->

<div class="login-container">
    <p-card header="MiFact - Challenge" [style]="{ width: '350px' }">

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" type="text" pInputText formControlName="username" class="w-full" />
                <small class="p-error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                    El usuario es requerido.
                </small>
            </div>

            <div class="field mt-3">
                <label for="password">Contraseña</label>
                <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full"></p-password>
                <small class="p-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    La contraseña es requerida.
                </small>
            </div>

            <div class="field mt-4">
                <p-button label="Iniciar Sesión" icon="pi pi-user" styleClass="w-full" type="submit"
                    [disabled]="loginForm.invalid"></p-button>
            </div>

        </form>

    </p-card>
</div>
